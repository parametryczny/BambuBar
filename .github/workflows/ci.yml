name: Build and self-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Show Swift version
        run: swift --version
      - name: Build
        run: make build
      - name: Run self-tests
        run: make selftest
      - name: Compile Keychain variant
        run: make build-keychain
